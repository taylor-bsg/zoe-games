<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Squishy speed check</title>
  <style>
    body {
      margin: 16px;
      font: 16px/1.4 -apple-system, system-ui, sans-serif;
      color: #1d2b53;
    }

    button {
      font: inherit;
      font-size: 18px;
      padding: 8px 18px;
      margin-right: 8px;
    }

    pre {
      white-space: pre-wrap;
    }

    canvas {
      display: block;
      width: 300px;
      height: 250px;
    }
  </style>
</head>
<body>
  <p><a href="../">🏠 Home</a></p>
  <h1>Squishy speed check</h1>
  <p>
    For developers. It times how long this computer takes to get the
    store's 3D view ready for each squishy and egg: compiling its 3D
    program, then drawing it once. It takes a minute or two on a slower
    computer. When it says Done, tap Copy and paste the result.
  </p>
  <button type="button" id="start">Start</button>
  <button type="button" id="copy" disabled>Copy</button>
  <pre id="out"></pre>

  <script type="module">
    import { VERSION } from '../version.js?v=0.8.4';
    import { ITEMS } from './items.js?v=0.8.4';

    const out = document.getElementById('out');
    const lines = [];
    const OCCLUSION = "  'float occlusion(vec3 p, vec3 n) {',";

    function log(line) {
      lines.push(line);
      out.textContent = lines.join('\n');
    }

    function pause(ms) {
      return new Promise(function (resolve) {
        setTimeout(resolve, ms);
      });
    }

    function seconds(ms) {
      return (ms / 1000).toFixed(2) + ' s';
    }

    // squishy.js with programs no cache has seen, and for the experiment,
    // without crease shading.
    async function module(variant) {
      let src = await (await fetch('./squishy.js?check=' + Date.now())).text();
      if (src.indexOf(OCCLUSION) < 0) throw new Error('squishy.js has changed');
      src = src.replace('const float FLOOR = -0.86;', 'const float FLOOR = -0.86000' + Math.floor(Math.random() * 1e6) + ';');
      if (variant === 'no crease shading') {
        src = src.replace(OCCLUSION, "  'float occlusion(vec3 p, vec3 n) { return 1.0; }',\n  'float unused(vec3 p, vec3 n) {',");
      }
      return import(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
    }

    function graphics() {
      const gl = document.createElement('canvas').getContext('webgl');
      if (!gl) return 'no WebGL';
      const info = gl.getExtension('WEBGL_debug_renderer_info');
      const name = info ? gl.getParameter(info.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
      const fast = !!document.createElement('canvas').getContext('webgl', { failIfMajorPerformanceCaveat: true });
      const background = !!gl.getExtension('KHR_parallel_shader_compile');
      return name + ' | ' + (fast ? 'hardware' : 'SOFTWARE') + ' | ' +
        (background ? 'background compiling' : 'no background compiling');
    }

    // Compiles one look's program, and draws it once.
    async function time(view, gl, name, look) {
      const started = performance.now();
      let longest = 0;
      let last = started;
      while (view.status(look) === 'compiling') {
        await pause(50);
        const now = performance.now();
        longest = Math.max(longest, now - last);
        last = now;
      }
      const compiled = performance.now();
      if (view.status(look) === 'failed') {
        log(name + ': FAILED');
        return;
      }
      view.draw(look, { angle: 0.5, squish: 0 });
      gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array(4));
      log(name + ': ' + seconds(compiled - started) + (longest > 200 ? ' (page froze up to ' + seconds(longest) + ')' : '') +
        ', first picture ' + seconds(performance.now() - compiled));
    }

    async function run(variant, looks) {
      const mod = await module(variant);
      const canvas = document.createElement('canvas');
      document.body.appendChild(canvas);
      const view = mod.createSquishy(canvas, { maxRatio: 1 });
      if (!view) {
        log('no WebGL');
        return;
      }
      const gl = canvas.getContext('webgl');
      for (const pair of looks) {
        await pause(100); // shows the last line before the next compile
        await time(view, gl, pair[0], pair[1]);
      }
      const lose = gl.getExtension('WEBGL_lose_context');
      if (lose) lose.loseContext();
      canvas.remove();
    }

    document.getElementById('start').addEventListener('click', async function () {
      this.disabled = true;
      lines.length = 0;
      log('Version ' + VERSION + ' | ' + navigator.userAgent);
      log('Graphics: ' + graphics());
      log('Compiling each squishy, then eggs:');
      try {
        const looks = ITEMS.map(function (item) {
          return [item.name, item.look];
        });
        looks.push(['egg', { egg: true, body: '#4cc26e' }]);
        looks.push(['egg with stars', { egg: true, body: '#5f3dc4', stars: true }]);
        looks.push(['egg with sunglasses', { egg: true, body: '#3b2f63', glasses: 'sun' }]);
        looks.push(['cube egg', { egg: true, body: '#ffbe55', cube: true }]);
        looks.push(['ball egg', { egg: true, body: '#228be6', sphere: true }]);
        looks.push(['heart egg', { egg: true, body: '#f06595', heart: true, hearts: true }]);
        await run('as in the store', looks);
        const party = ITEMS.filter(function (item) {
          return item.id === 'party';
        })[0];
        log('Experiment:');
        await run('no crease shading', [['Party Puff without crease shading', party.look]]);
        log('Done');
      } catch (e) {
        log('Error: ' + e.message);
      }
      document.getElementById('copy').disabled = false;
    });

    document.getElementById('copy').addEventListener('click', function () {
      const text = lines.join('\n');
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(function () {
          log('(Copied)');
        });
      } else { // select it, for Ctrl+C
        const range = document.createRange();
        range.selectNodeContents(out);
        window.getSelection().removeAllRanges();
        window.getSelection().addRange(range);
      }
    });
  </script>
</body>
</html>
