<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#4cc9f0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Zoe's Games">
  <title>Squishy Store · Zoe's Games</title>
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <link rel="icon" href="../icons/icon-192.png">
  <link rel="stylesheet" href="../shared/base.css?v=0.7.3">
  <style>
    .purse {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 4px 24px 6px;
      border-radius: 999px;
      background: var(--white);
      color: var(--ink);
      box-shadow: var(--shadow);
      line-height: 1.1;
      white-space: nowrap;
    }

    .purse-label {
      font-size: 14px;
      font-weight: 800;
      opacity: 0.7;
    }

    .purse-value {
      font-size: 30px;
      font-weight: 900;
    }

    .purse.is-paid {
      animation: pop 0.5s ease;
    }

    /* As wide as the Home button, so the purse stays centered. */
    .topbar-balance {
      width: var(--tap);
    }

    /* One squishy at a time, as big as fits, with arrows to the others.
       Landscape puts the name and buy button beside it. */
    .stage {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 12px;
      padding: 12px 12px 18px;
      text-align: center;
    }

    @media (orientation: landscape) {
      .stage {
        flex-direction: row;
        padding: 12px 24px 12px 12px;
      }
    }

    /* The arrows float over the view's edges, so the squishy gets the whole
       width, with room to squash wide and stretch tall. */
    .stage-row {
      flex: 1;
      min-width: 0;
      min-height: 0;
      position: relative;
      display: flex;
    }

    /* The canvas sits in a box and never sizes itself, so drawing at the
       box's size can't make the box grow. */
    .canvas-box {
      flex: 1;
      min-width: 0;
      align-self: stretch;
      position: relative;
    }

    .stage-canvas,
    .stage-fallback {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .stage-canvas {
      touch-action: none;
      cursor: grab;
    }

    .stage-fallback {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 160px;
    }

    .arrow {
      position: absolute;
      z-index: 1;
      top: 50%;
      width: 80px;
      height: 80px;
      margin-top: -40px;
      padding: 0;
      border-radius: 50%;
    }

    #prev {
      left: 0;
    }

    #next {
      right: 0;
    }

    .arrow svg {
      width: 46%;
      height: 46%;
    }

    .info {
      flex: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    @media (orientation: landscape) {
      .info {
        width: 310px;
      }
    }

    .stage-name {
      font-size: 40px;
      font-weight: 900;
      line-height: 1.1;
    }

    /* Which squishy this is: one dot each; owned ones are gold. */
    .dots {
      display: flex;
      gap: 10px;
      margin: 2px 0 4px;
    }

    .dot {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #d6ddf5;
      transition: transform 0.2s ease;
    }

    .dot.is-owned {
      background: var(--sun);
    }

    .dot.is-here {
      transform: scale(1.45);
      box-shadow: 0 0 0 2px var(--ink);
    }

    .stage-hint {
      min-height: 1.3em;
      font-size: 20px;
      opacity: 0.75;
    }

    .stage-hint span {
      display: inline-block;
    }

    .buy {
      width: 100%;
      font-size: clamp(28px, 4.4vmin, 40px);
      white-space: nowrap;
    }

    .buy.is-short {
      background: #e9ecef;
      color: #59627d;
    }

    .buy.is-owned {
      background: var(--good-bg);
      color: var(--good);
    }

    .buy.is-nudged {
      animation: wiggle 0.45s ease;
    }

    /* Phone-sized screens: smaller arrows and name. */
    @media (max-width: 500px) {
      .arrow {
        width: var(--tap);
        height: var(--tap);
        margin-top: calc(var(--tap) / -2);
      }

      .stage-name {
        font-size: 32px;
      }

      /* Room for the two-line hint, so the view doesn't jump when it changes. */
      .stage-hint {
        min-height: 2.6em;
      }
    }

    .ledger {
      margin-top: 8px;
      font-size: 15px;
      text-align: center;
      opacity: 0.8;
    }
  </style>
</head>
<body ontouchstart="">
  <div class="page fit">
    <header class="topbar">
      <a class="btn btn-icon" href="../" aria-label="Home">🏠</a>
      <div class="purse" id="purse">
        <span class="purse-label">My coins</span>
        <span class="purse-value" id="balance"></span>
      </div>
      <div class="topbar-balance"></div>
    </header>

    <main class="card stage">
      <div class="stage-row">
        <button type="button" class="btn arrow" id="prev" aria-label="Previous squishy">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="3.4"
            stroke-linecap="round" stroke-linejoin="round"><path d="M15 4.5L7.5 12 15 19.5"/></svg>
        </button>
        <div class="canvas-box">
          <canvas class="stage-canvas" id="stage" aria-hidden="true"></canvas>
        </div>
        <button type="button" class="btn arrow" id="next" aria-label="Next squishy">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="3.4"
            stroke-linecap="round" stroke-linejoin="round"><path d="M9 4.5l7.5 7.5L9 19.5"/></svg>
        </button>
      </div>
      <div class="info">
        <p class="stage-name" id="stage-name"></p>
        <div class="dots" id="dots" aria-hidden="true"></div>
        <p class="stage-hint" id="stage-hint"></p>
        <button type="button" class="btn btn-big buy" id="buy"></button>
      </div>
    </main>
    <p class="ledger" id="ledger"></p>
  </div>

  <script type="module" src="store.js?v=0.7.3"></script>
</body>
</html>
