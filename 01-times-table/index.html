<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#4cc9f0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Zoe's Games">
  <title>Zoe Multiplies · Zoe's Games</title>
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <link rel="icon" href="../icons/icon-192.png">
  <link rel="stylesheet" href="../shared/base.css?v=0.7.13">
  <style>
    /* The speed score: the geomean of every cell's score. Lower is better. */
    .speed {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 4px 22px 6px;
      border-radius: 999px;
      background: var(--white);
      color: var(--ink);
      box-shadow: var(--shadow);
      line-height: 1.1;
      white-space: nowrap;
    }

    .speed-label {
      font-size: 14px;
      font-weight: 800;
      opacity: 0.7;
    }

    .speed-value {
      font-size: 30px;
      font-weight: 900;
    }

    .speed.is-record {
      background: var(--sun);
      animation: pop 0.5s ease;
    }

    /* Shown only while playing; it keeps its space so the speed stays
       centered. */
    .pause-button {
      visibility: hidden;
    }

    .board {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 12px;
    }

    .prompt {
      flex: none;
      height: clamp(140px, 21vmin, 190px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 24px;
      text-align: center;
    }

    .prompt h1 {
      text-shadow: none;
    }

    .intro,
    .playing {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .problem {
      display: flex;
      align-items: center;
      gap: 0.25em;
      font-size: clamp(44px, 8.5vmin, 100px);
      font-weight: 800;
      line-height: 1;
      white-space: nowrap;
    }

    .message {
      min-height: 1.3em;
      font-size: 26px;
      font-weight: 800;
    }

    .message.good { color: var(--good); }
    .message.oops { color: var(--oops); }
    .message.record { color: var(--violet); }

    /* The right answer, shown after a wrong one. */
    .keypad-display.is-reveal {
      border-color: var(--sun);
      background: #fff3bf;
      color: var(--ink);
    }

    .area {
      flex: 1;
      min-height: 0;
      display: flex;
      gap: 24px;
    }

    .grid-box {
      flex: 1;
      min-width: 0;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* game.js sets the rows, columns, size, and font size. */
    .grid {
      display: grid;
    }

    .label {
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
    }

    .cell {
      border-radius: 18%;
    }

    .cell.is-current {
      position: relative;
      box-shadow: 0 0 0 3px var(--ink);
    }

    /* While paused, don't give away which problem is waiting. */
    .grid.is-paused .cell.is-current {
      box-shadow: none;
    }

    .cell.is-updated {
      animation: pop 0.35s ease;
    }

    /* Just turned green: a big pop with a white ring. */
    .cell.is-crowned {
      position: relative;
      z-index: 2;
      animation: crown 0.7s ease;
    }

    @keyframes crown {
      30% {
        transform: scale(1.7);
        box-shadow: 0 0 0 4px var(--white);
      }
    }

    /* As wide as the keypad: three keys and two gaps. */
    .side {
      flex: none;
      width: calc(var(--key) * 3 + 24px);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .setup {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .setup .btn,
    .resume-button {
      width: 100%;
    }

    .size-button[aria-pressed="true"] {
      background: var(--ink);
      color: var(--white);
    }

    /* Clearing takes a 1.5 s hold, so a stray tap can't wipe the scores. */
    .clear-button,
    .clear-button:active {
      position: relative;
      overflow: hidden;
      background: transparent;
      color: var(--white);
      box-shadow: inset 0 0 0 3px rgba(255, 255, 255, 0.7);
      font-size: 20px;
      touch-action: none;
    }

    .clear-fill {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 0;
      background: rgba(240, 62, 62, 0.85);
    }

    .clear-button.is-holding .clear-fill {
      width: 100%;
      transition: width 1.5s linear;
    }

    .clear-label {
      position: relative;
    }

    /* Portrait has height to spare: a bigger problem, sized to the width. */
    @media (orientation: portrait) {
      .prompt {
        height: clamp(150px, 20vh, 230px);
      }

      .problem {
        font-size: clamp(44px, 12vw, 100px);
      }
    }
  </style>
</head>
<body ontouchstart="">
  <div class="page fit">
    <header class="topbar">
      <a class="btn btn-icon" href="../" aria-label="Home">🏠</a>
      <div class="speed" id="speed-box">
        <span class="speed-label">Speed score</span>
        <span class="speed-value" id="speed"></span>
      </div>
      <button type="button" class="btn btn-icon pause-button" id="pause-button" aria-label="Pause">⏸️</button>
    </header>

    <main class="board">
      <div class="card prompt">
        <div class="intro" id="intro">
          <h1>Zoe Multiplies</h1>
          <p>Answer fast to turn the grid green!</p>
          <p id="record-pay"></p>
        </div>
        <div class="intro" id="paused" hidden>
          <h1>Paused</h1>
          <p>The clock is stopped. Tap Resume when you're ready.</p>
        </div>
        <div class="playing" id="playing" hidden>
          <div class="problem"><span id="question"></span><span id="answer"></span></div>
          <p class="message" id="message"></p>
        </div>
      </div>

      <div class="area">
        <div class="grid-box" id="grid-box">
          <div class="grid" id="grid" aria-hidden="true"></div>
        </div>
        <div class="side">
          <div class="setup" id="setup">
            <button type="button" class="btn btn-white size-button" data-size="10">10 × 10</button>
            <button type="button" class="btn btn-white size-button" data-size="15">15 × 15</button>
            <button type="button" class="btn btn-big" id="start-button">Start</button>
            <button type="button" class="btn clear-button" id="clear-button">
              <span class="clear-fill"></span>
              <span class="clear-label" id="clear-label">Hold to clear scores</span>
            </button>
          </div>
          <div id="keypad" hidden></div>
          <button type="button" class="btn btn-big resume-button" id="resume-button" hidden>Resume</button>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="game.js?v=0.7.13"></script>
</body>
</html>
