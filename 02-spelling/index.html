<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#4cc9f0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Zoe's Games">
  <title>Zoe Spells · Zoe's Games</title>
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <link rel="icon" href="../icons/icon-192.png">
  <link rel="stylesheet" href="../shared/base.css?v=0.3.4">
  <style>
    /* Gold-brick count, in the middle of the top bar. */
    .tally {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 4px 22px 6px;
      border-radius: 999px;
      background: var(--white);
      color: var(--ink);
      box-shadow: var(--shadow);
      line-height: 1.1;
      white-space: nowrap;
    }

    .tally-label {
      font-size: 14px;
      font-weight: 800;
      opacity: 0.7;
    }

    .tally-value {
      font-size: 30px;
      font-weight: 900;
    }

    /* As wide as the Home button, so the tally stays centered. */
    .topbar-balance {
      width: var(--tap);
    }

    .board {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      grid-template-areas: "prompt" "scene" "panel";
      gap: 16px;
      margin-top: 12px;
    }

    @media (orientation: landscape) {
      .board {
        grid-template-columns: minmax(0, 1.9fr) minmax(0, 1fr);
        grid-template-rows: auto minmax(0, 1fr);
        grid-template-areas: "scene prompt" "scene panel";
      }
    }

    .scene {
      grid-area: scene;
      min-width: 0;
      min-height: 0;
    }

    .scene svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .prompt {
      grid-area: prompt;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 150px;
      padding: 18px 24px;
      text-align: center;
    }

    /* Room for the Say it again button. */
    .prompt.is-playing {
      padding-right: 84px;
    }

    .prompt h1 {
      font-size: clamp(36px, 5.5vmin, 64px);
      text-shadow: none;
    }

    .intro {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .sentence {
      font-size: clamp(26px, 4.4vmin, 42px);
      font-weight: 800;
      line-height: 1.35;
    }

    /* The gap in the sentence; it shows the right word once answered. */
    .gap {
      display: inline-block;
      min-width: 3.2em;
      padding: 0 0.15em;
      border-bottom: 0.12em solid var(--ink);
      border-radius: 0.1em;
      line-height: 1.1;
    }

    .gap.is-filled {
      border-bottom-color: var(--good);
      background: var(--good-bg);
      color: var(--good);
    }

    .say-again {
      position: absolute;
      top: 50%;
      right: 12px;
      margin-top: calc(var(--tap) / -2);
      box-shadow: inset 0 0 0 3px #d6ddf5;
    }

    .panel {
      grid-area: panel;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .setup {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .setup .btn {
      width: 100%;
    }

    .choices {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    @media (orientation: landscape) {
      .choices {
        grid-template-columns: 1fr;
      }
    }

    .choice {
      min-height: 84px;
      border-radius: 22px;
      background: var(--white);
      font-size: clamp(28px, 4.6vmin, 44px);
    }

    .choice.is-right {
      background: var(--good-bg);
      color: var(--good);
      box-shadow: 0 0 0 5px var(--good), var(--shadow);
    }

    .choice.is-wrong {
      background: var(--oops-bg);
      color: var(--oops);
      animation: wiggle 0.45s ease;
    }

    /* After a wrong pick, the right spelling glows for 2 s. */
    .choice.is-answer {
      background: var(--good-bg);
      color: var(--good);
      animation: glow 0.7s ease-in-out infinite alternate;
    }

    @keyframes glow {
      from {
        box-shadow: 0 0 0 4px var(--good), var(--shadow);
      }
      to {
        box-shadow: 0 0 0 10px rgba(27, 138, 75, 0.35), var(--shadow);
      }
    }

    /* Clearing takes a 1.5 s hold, so a stray tap can't wipe the wall. */
    .clear-button,
    .clear-button:active {
      position: relative;
      overflow: hidden;
      background: transparent;
      color: var(--white);
      box-shadow: inset 0 0 0 3px rgba(255, 255, 255, 0.7);
      font-size: 20px;
      touch-action: none;
    }

    .clear-fill {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 0;
      background: rgba(240, 62, 62, 0.85);
    }

    .clear-button.is-holding .clear-fill {
      width: 100%;
      transition: width 1.5s linear;
    }

    .clear-label {
      position: relative;
    }

    /* The scene. */

    .brick {
      transition: fill 0.3s ease;
      transform-box: fill-box;
      transform-origin: center;
    }

    .brick.is-target {
      stroke: var(--white);
      stroke-width: 5;
    }

    .brick.is-hit {
      animation: brick-pop 0.4s ease;
    }

    .brick.is-gold {
      animation: brick-gold 0.8s ease;
    }

    @keyframes brick-pop {
      40% {
        transform: scale(1.18);
      }
    }

    @keyframes brick-gold {
      30% {
        transform: scale(1.4);
      }
    }

    .bolt {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      animation: bolt 0.5s ease-out forwards;
    }

    @keyframes bolt {
      0%, 30% {
        opacity: 1;
      }
      40% {
        opacity: 0.4;
      }
      50% {
        opacity: 1;
      }
      100% {
        opacity: 0;
      }
    }

    #wand-star {
      transform-box: fill-box;
      transform-origin: center;
    }

    #wand-star.is-casting {
      animation: cast 0.4s ease;
    }

    @keyframes cast {
      40% {
        transform: scale(1.8) rotate(36deg);
      }
    }

    /* The dragon waits behind the wall with its horns showing, peeks over
       now and then, and flies away when every brick is gold. */
    #dragon {
      transform: translateY(120px);
    }

    #dragon.is-peeking {
      animation: peek 2.6s ease-in-out;
    }

    @keyframes peek {
      25%, 75% {
        transform: translateY(0);
      }
    }

    #dragon.is-leaving {
      animation: fly-away 2.4s ease-in forwards;
    }

    @keyframes fly-away {
      0% {
        transform: translateY(120px);
      }
      30% {
        transform: translateY(-20px);
      }
      100% {
        transform: translate(520px, -620px) rotate(25deg);
        opacity: 0;
      }
    }

    #dragon.is-gone {
      display: none;
    }
  </style>
</head>
